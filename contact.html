<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLearn - Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">EduLearn</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="courses.html">Courses</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link btn btn-primary text-white px-3 ms-2"
                href="signup.html"
                >Sign Up</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Section -->
    <section class="py-5 container">
      <h2>Contact Us</h2>
      <p>Email: info@edulearn.com | Phone: +880 1234 567 890</p>
      <form class="row g-3 mt-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Your Name" />
        </div>
        <div class="col-md-6">
          <input type="email" class="form-control" placeholder="Your Email" />
        </div>
        <div class="col-12">
          <textarea
            class="form-control"
            rows="4"
            placeholder="Your Message"
          ></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </section>

    <footer class="bg-dark text-white text-center py-3">
      <p>&copy; 2025 EduLearn. All Rights Reserved.</p>
    </footer>
  </body>
